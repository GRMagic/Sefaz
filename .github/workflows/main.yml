name: Atualizar pacote no Nuget.org

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Necessário para o Trusted Publishing do nuget.org (OIDC)

    steps:
    - uses: actions/checkout@v7

    - name: Configurar .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Contruir e Criar Pacote
      run: dotnet build --configuration Release

    - name: Testar
      run: dotnet test

    - name: Obter chave temporária do NuGet
      if: github.event_name == 'push'
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publicar
      if: github.event_name == 'push'
      run: dotnet nuget push ./src/Sefaz.Core/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
